<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta property="og:url" content="https://yestermester.github.io/eindex.html" />
    <title>Yester's Unblocked Games</title>
    <meta property="og:title" content="Yester's Unblocked Games" />
    <meta property="og:type" content="website" />
    <meta property="twitter:card" content="summary_large_image" />
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: black;
        color: white;
        overflow-x: hidden;
      }
      #starfield {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
      }
      /* Title link */
      .title-link {
        position: fixed;
        top: 15px;
        left: 20px;
        z-index: 10;
        color: white;
        text-decoration: none;
        font-size: 1.2rem;
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
        padding: 4px 8px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.05);
        animation: pulse 2s infinite alternate;
      }
      .title-link:hover {
        background: rgba(255,255,255,0.1);
        box-shadow: 0 0 15px #ff5555,0 0 30px #ff5555;
      }
      /* Back button */
      .back-btn {
        position: fixed;
        top: 55px;
        left: 20px;
        z-index: 10;
        color: white;
        text-decoration: none;
        font-size: 1rem;
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
        padding: 6px 12px;
        border-radius: 6px;
        border: 2px solid #ff5555;
        box-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
        background: rgba(255, 0, 0, 0.15);
        transition: 0.3s;
      }
      .back-btn:hover {
        background: #ff5555;
        color: black;
        box-shadow: 0 0 15px #ff8888,0 0 30px #ff5555;
      }
      /* Version badge */
      .version {
        position: fixed;
        top: 15px;
        right: 20px;
        z-index: 10;
        font-size: 0.9rem;
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
        padding: 4px 8px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.05);
      }
      /* Page content */
      .content {
        position: relative;
        z-index: 10;
        width: 95%;
        max-width: 1200px;
        margin: 120px auto 60px auto;
      }
      h1 {
        text-align: center;
        font-size: 2.5rem;
        text-shadow: 0 0 10px #ff5555,0 0 20px #ff5555;
        margin-bottom: 20px;
        animation: pulse 2s infinite alternate;
      }
      /* Search bar */
      #searchInput {
        width: 100%;
        max-width: 500px;
        display: block;
        margin: 0 auto 30px auto;
        padding: 10px 15px;
        border-radius: 10px;
        border: 2px solid #ff5555;
        font-size: 1rem;
        background: rgba(255, 0, 0, 0.1);
        color: white;
        text-align: center;
        outline: none;
        box-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
        transition: 0.3s;
      }
      #searchInput:focus {
        background: rgba(255,0,0,0.25);
        box-shadow: 0 0 15px #ff8888;
      }
      /* Game grid */
      #gameContainer {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 15px;
      }
      .game-btn {
        display: block;
        text-align: center;
        padding: 12px 0;
        background: rgba(255, 0, 0, 0.15);
        border: 2px solid #ff5555;
        border-radius: 10px;
        text-decoration: none;
        color: white;
        font-size: 1rem;
        box-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
        transition: 0.3s;
        animation: pulse 2s infinite alternate;
      }
      .game-btn:hover {
        background: #ff5555;
        color: black;
        box-shadow: 0 0 20px #ff8888,0 0 40px #ff5555;
        transform: scale(1.05);
      }
      @keyframes pulse {
        0% { transform: scale(1); text-shadow: 0 0 10px #ff5555,0 0 20px #ff5555; }
        50% { transform: scale(1.02); text-shadow: 0 0 20px #ff7777,0 0 40px #ff5555; }
        100% { transform: scale(1); text-shadow: 0 0 10px #ff5555,0 0 20px #ff5555; }
      }
      @media (max-width: 600px) {
        h1 { font-size: 2rem; }
        #searchInput { font-size: 0.9rem; }
        .game-btn { font-size: 0.9rem; padding: 10px 0; }
      }
    </style>
  </head>
  <body>
    <!-- Background -->
    <canvas id="starfield"></canvas>
    <script src="./Assets/fixCanvas.js"></script>

    <!-- Title & Back -->
    <a href="https://yestermester.github.io/" class="title-link">🎮 Yester's Unblocked Games</a>
    <a href="https://yestermester.github.io/games.html" class="back-btn">⬅ Back</a>
    <div class="version">1.0.7 Revamp</div>

    <!-- Main Content -->
    <div class="content">
      <h1>Games Page 2</h1>
      <input type="text" id="searchInput" placeholder="Search games..." oninput="filterGames()" />
      <div id="gameContainer">
        <!-- Example buttons (replace/add your own list) -->
        <a href="./Assets/yesterspace/index.html" class="game-btn">(MY GAME) Yester Space 1.0.3</a>
        <a href="./Assets/mc1122/index.html" class="game-btn">Minecraft 1.12.2</a>
        <a href="./Assets/baldi/index.html" class="game-btn">Baldi's Basics</a>
        <a href="./Assets/ssf/index.html" class="game-btn">Super Smash Flash</a>
        <a href="./Assets/stickrpg/index.html" class="game-btn">Stick RPG</a>
        <a href="./Assets/gta1/index.html" class="game-btn">Grand Theft Auto</a>
        <a href="./Assets/gta2/index.html" class="game-btn">Grand Theft Auto 2</a>
      </div>
    </div>

    <!-- Search Script -->
    <script>
      function filterGames() {
        const input = document.getElementById("searchInput").value.toLowerCase();
        const games = document.querySelectorAll("#gameContainer .game-btn");
        games.forEach((g) => {
          g.style.display = g.textContent.toLowerCase().includes(input) ? "block" : "none";
        });
      }
    </script>
  </body>
</html>
